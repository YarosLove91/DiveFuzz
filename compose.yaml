# Convenience wrapper around the DiveFuzz core image.
#
# It exists mainly to keep the /work mount and the external-DUT mount in one
# place instead of repeating long `docker run -v` lines.
#
#   docker compose build
#   docker compose run --rm smoke          # end-to-end smoke test
#   docker compose run --rm divefuzz --config /work/my_test.yaml

services:
  divefuzz:
    build:
      context: .
      dockerfile: Dockerfile
    image: divefuzz:latest
    volumes:
      # Persistent working directory: generated seeds land in /work/seeds and
      # run_dut.py writes its relative `outputs` directory to /work/outputs.
      - ./docker-smoke-out:/work
      # External DUT: uncomment and point at a real, already-built DUT tree.
      # The container path below is what `emu_path` in your YAML must use.
      # - /absolute/host/path/to/XiangShan:/dut/XiangShan:ro
    command: ["--help"]

  smoke:
    extends:
      service: divefuzz
    command: ["smoke"]

  probe:
    extends:
      service: divefuzz
    command: ["probe"]

  # ---------------------------------------------------------------------------
  # XiangShan profile. Separate image: it carries a XiangShan Verilator
  # emulator built from the pinned commit, so no DUT has to be mounted.
  #
  #   docker compose --profile xiangshan build          # hours: RTL build
  #   docker compose --profile xiangshan run --rm xiangshan
  #   docker compose --profile xiangshan run --rm xiangshan-run --config /work/my.yaml
  #
  # linux/amd64 is mandatory: Chisel 6.7.0 resolves firtool 1.62.0, which has
  # no linux-arm64 binary, and XiangShan's diff references are x86-64 objects.
  # ---------------------------------------------------------------------------
  xiangshan:
    profiles: ["xiangshan"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/xiangshan.Dockerfile
      platforms: ["linux/amd64"]
      args:
        DIVEFUZZ_BASE_IMAGE: divefuzz:amd64
    image: divefuzz-xiangshan:latest
    volumes:
      - ./docker-xiangshan-out:/work
    command: ["xiangshan-validate"]

  xiangshan-run:
    profiles: ["xiangshan"]
    extends:
      service: xiangshan
    command: ["--help"]
